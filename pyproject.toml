[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-to-work-jensen"
version = "1.0.0"
description = "A source-aware NVIDIA leadership research console with NVDA market context, hypothetical CUDA roadmaps, and affectionate satire."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["nvidia", "cuda", "research-dashboard", "rss", "streamlit", "market-context", "satire"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.54.0,<2",
  "plotly>=7.1,<8",
  "yfinance>=1.8.0,<2",
]

[project.scripts]
otwj = "otwj.cli:main"

[tool.setuptools.packages.find]
include = ["otwj*"]

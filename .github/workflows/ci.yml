name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated project environment
        run: python -m venv .venv
      - name: Install project and dashboard dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip "setuptools>=84.1.0" wheel
          .venv/bin/python -m pip install -r requirements.txt
      - name: Compile
        run: .venv/bin/python -m compileall -q app.py otwj tests scripts
      - name: Test
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Audit project dependencies in isolation
        run: |
          python -m venv .audit-tool
          .audit-tool/bin/python -m pip install --upgrade pip pip-audit
          SITE_PACKAGES="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          .audit-tool/bin/pip-audit --path "$SITE_PACKAGES" --skip-editable

name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for capture tools
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install browser capture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Capture real browser screenshots and build demo GIF
        run: python scripts/build_demo_assets.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5
